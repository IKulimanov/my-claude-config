name: PG-1 Создание учётки PostgreSQL
code: pg-1
source: jira
external-key: "100500"
# manual | auto | by-database; by-database — подтверждаем только на БД, помеченных ручными
manual-mode: by-database

# блок выдачи прав повторяет поля PG-2: при флажке grant_now шаги выдачи
# включаются в ту же задачу, отдельная заявка не нужна
variables:
  database_code:
    description: Целевая БД
    type: dictionary-item
    dictionary: databases
    from: customfield_10001
    required: true

  target_username:
    description: Имя создаваемой учётки
    type: string
    from: customfield_10002
    required: true

  grant_now:
    description: Выдать права сразу
    type: boolean
    from: customfield_10004

  scope:
    description: Область выдачи прав
    type: enum
    values: [schema, owner, role]
    from: customfield_10020

  target_schema:
    description: Схема
    type: string
    from: customfield_10011

  grant_scope:
    description: Объём — все объекты или конкретные
    type: enum
    values: [all, objects]
    from: customfield_10012

  objects:
    description: Конкретные объекты
    type: string
    multiple: true
    from: customfield_10013

  privileges:
    description: Привилегии
    type: enum
    values: [SELECT, INSERT, UPDATE, DELETE, EXECUTE, USAGE]
    multiple: true
    from: customfield_10021

  target_role:
    description: Существующая роль
    type: string
    from: customfield_10022

  future_objects:
    description: Права на будущие объекты
    type: boolean
    from: customfield_10023

  requester:
    description: Автор заявки
    type: string
    from: issue.reporter

stages:
  # стейдж согласования: согласующие типа заявки — параметр стадии,
  # дополняются каталогом database_approver по целевой БД;
  # кворум всегда «все»: любой reject отклоняет, все approved — success
  - code: approval
    name: Согласование в Jira
    handler: jira-approval
    parameters:
      approvers:
        - i.petrov
        - s.sidorov
    listeners:
      on-start:
        - handler: jira-transition
          parameters:
            status: На согласовании
            fields:
              customfield_10100: ${{ stage.approvers }}
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: task-created
      on-success:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: task-approved
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  # стейдж сборки задачи: шаги операции и подготовка скриптов.
  # порядок записей — порядок выполнения на целевой БД
  - code: prepare
    name: Сборка задачи
    handler: task-preparation
    parameters:
      custom-steps: allowed # разрешаем ли dba менять шаги
      steps:
        - code: check-user-free
          name: Учётка свободна
          template: pg-check-user-free@1
          params:
            username: ${{ target_username }}

        - code: create-user
          name: Создать учётку
          template: pg-create-user@1
          params:
            username: ${{ target_username }}
            password: ${{ generator.password }}

        - code: check-schema-exists
          name: Схема существует
          template: pg-check-schema-exists@1
          expression: grant_now and (scope == 'schema' or scope == 'owner')
          params:
            schema: ${{ target_schema }}

        - code: check-role-exists
          name: Роль существует
          template: pg-check-role-exists@1
          expression: grant_now and scope == 'role'
          params:
            role: ${{ target_role }}

        - code: grant-schema-all
          name: Права на все объекты схемы
          template: pg-grant-schema-all@1
          expression: grant_now and scope == 'schema' and grant_scope == 'all'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            privileges: ${{ privileges }}

        - code: grant-objects
          name: Права на конкретные объекты
          template: pg-grant-objects@1
          expression: grant_now and scope == 'schema' and grant_scope == 'objects'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            objects: ${{ objects }}
            privileges: ${{ privileges }}

        - code: grant-schema-owner
          name: Права владельца схемы
          template: pg-grant-schema-owner@1
          expression: grant_now and scope == 'owner'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}

        # ALTER DEFAULT PRIVILEGES: права на объекты, которые появятся позже
        - code: grant-future-objects
          name: Права на будущие объекты
          template: pg-grant-future-objects@1
          expression: grant_now and scope == 'owner' and future_objects
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            privileges: ${{ privileges }}

        - code: grant-role
          name: Выдать существующую роль
          template: pg-grant-role@1
          expression: grant_now and scope == 'role'
          params:
            username: ${{ target_username }}
            role: ${{ target_role }}

  # стейдж подтверждения: ручной режим, дба может изменять шаги или добавлять, отменить задачу.
  # активируется по manual-mode флоу (здесь by-database — по флагу целевой БД)
  # или по expression; иначе пропускается
  - code: confirm
    name: Подтверждение выполнения на дашборде
    handler: dashboard-approval
    # дополнительное условие: критичные БД подтверждаем всегда
    expression: database_code.critical
    parameters:
      approvers:
        dictionary: db-assignments
        filter: database == database_code
    listeners:
      # dba отмменил задачу
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  # стейдж исполнения
  - code: execute
    name: Выполнение на БД
    handler: database-execution
    listeners:
      #опциональные листенеры
      on-start:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-started
      on-success:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-finished
      on-error:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-failed

  # стейдж отправки кредов + тут же меняем статус в jira
  - code: deliver
    name: Отправка кредов заказчику
    handler: email-delivery
    parameters:
      to: ${{ requester }}
      template: creds-delivery
      data:
        username: ${{ target_username }}
        password: ${{ generator.password }}
    listeners:
      on-success:
        - handler: jira-transition
          parameters:
            status: Готово
            comment-template: task-done
