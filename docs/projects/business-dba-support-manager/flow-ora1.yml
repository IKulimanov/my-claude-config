name: ORA-1 Создание учётной записи Oracle
code: ora-1
source: jira
# id типа запроса «Центра поддержки»; проставить после заведения формы
external-key: "100503"
# manual | auto | by-database; by-database — подтверждаем только на БД, помеченных ручными
manual-mode: by-database

# блок выдачи прав повторяет поля ORA-2: при флажке grant_now шаги выдачи
# включаются в ту же задачу, отдельная заявка не нужна
variables:
  database_code:
    description: Целевая БД
    type: dictionary-item
    dictionary: databases
    from: customfield_10001
    required: true

  target_username:
    description: Имя учётной записи и схемы
    type: string
    from: customfield_10002
    required: true

  grant_now:
    description: Выдать права сразу
    type: boolean
    from: customfield_10004

  scope:
    description: Область выдачи прав
    type: enum
    values: [schema, owner, any]
    from: customfield_10010

  target_schema:
    description: Схема
    type: string
    from: customfield_10011

  grant_scope:
    description: Объём — все объекты или конкретные
    type: enum
    values: [all, objects]
    from: customfield_10012

  objects:
    description: Конкретные объекты
    type: string
    multiple: true
    from: customfield_10013

  privileges:
    description: Привилегии
    type: enum
    values: [SELECT, INSERT, UPDATE, DELETE, EXECUTE]
    multiple: true
    from: customfield_10014

  public_synonyms:
    description: Публичные синонимы
    type: boolean
    from: customfield_10015

  db_links:
    description: Database links
    type: boolean
    from: customfield_10016

  requester:
    description: Автор заявки
    type: string
    from: issue.reporter

stages:
  # согласование — только если сразу выдаются опасные права
  - code: approval
    name: Согласование в Jira
    handler: jira-approval
    expression: grant_now and (scope == 'any' or public_synonyms)
    parameters:
      approvers:
        - i.petrov
        - s.sidorov
    listeners:
      on-start:
        - handler: jira-transition
          parameters:
            status: На согласовании
            fields:
              customfield_10100: ${{ stage.approvers }}
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: task-created
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  # стейдж сборки задачи: шаги операции и подготовка скриптов.
  # порядок записей — порядок выполнения на целевой БД
  - code: prepare
    name: Сборка задачи
    handler: task-preparation
    parameters:
      custom-steps: allowed
      steps:
        - code: check-user-free
          name: Учётка свободна
          template: ora-check-user-free@1
          params:
            username: ${{ target_username }}

        - code: create-user
          name: Создать учётку
          template: ora-create-user@1
          params:
            username: ${{ target_username }}
            password: ${{ generator.password }}

        - code: check-schema-exists
          name: Схема существует
          template: ora-check-schema-exists@1
          expression: grant_now and (scope == 'schema' or scope == 'owner')
          params:
            schema: ${{ target_schema }}

        - code: grant-schema-all
          name: Права на все объекты схемы
          template: ora-grant-schema-all@1
          expression: grant_now and scope == 'schema' and grant_scope == 'all'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            privileges: ${{ privileges }}

        - code: grant-objects
          name: Права на конкретные объекты
          template: ora-grant-objects@1
          expression: grant_now and scope == 'schema' and grant_scope == 'objects'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            objects: ${{ objects }}
            privileges: ${{ privileges }}

        - code: grant-schema-owner
          name: Права владельца схемы
          template: ora-grant-schema-owner@1
          expression: grant_now and scope == 'owner'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}

        - code: grant-public-synonyms
          name: Публичные синонимы
          template: ora-grant-public-synonyms@1
          expression: grant_now and scope == 'owner' and public_synonyms
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}

        - code: grant-db-links
          name: Database links
          template: ora-grant-db-links@1
          expression: grant_now and scope == 'owner' and db_links
          params:
            username: ${{ target_username }}

        - code: grant-any
          name: Права на всю БД
          template: ora-grant-any@1
          expression: grant_now and scope == 'any'
          params:
            username: ${{ target_username }}
            privileges: ${{ privileges }}

  # стейдж подтверждения: активируется по manual-mode флоу (здесь by-database)
  # или по expression; иначе пропускается
  - code: confirm
    name: Подтверждение выполнения на дашборде
    handler: dashboard-approval
    # дополнительное условие: критичные БД подтверждаем всегда
    expression: database_code.critical
    parameters:
      approvers:
        dictionary: db-assignments
        filter: database == database_code
    listeners:
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  # стейдж исполнения
  - code: execute
    name: Выполнение на БД
    handler: database-execution
    listeners:
      on-error:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-failed

  # стейдж отправки кредов + тут же меняем статус в jira
  - code: deliver
    name: Отправка кредов заказчику
    handler: email-delivery
    parameters:
      to: ${{ requester }}
      template: creds-delivery
      data:
        username: ${{ target_username }}
        password: ${{ generator.password }}
    listeners:
      on-success:
        - handler: jira-transition
          parameters:
            status: Готово
            comment-template: task-done
