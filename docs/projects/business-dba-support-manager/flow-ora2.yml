name: ORA-2 Выдача прав существующей учётке Oracle
code: ora-2
source: jira
external-key: "100502"
# manual | auto | by-database; by-database — подтверждаем только на БД, помеченных ручными
manual-mode: by-database

variables:
  database_code:
    description: Целевая БД
    type: dictionary-item
    dictionary: databases
    from: customfield_10001
    required: true

  target_username:
    description: Учётная запись
    type: string
    from: customfield_10002
    required: true

  scope:
    description: Область выдачи прав
    type: dictionary-item
    dictionary: ora-grant-scopes
    from: customfield_10010
    required: true

  target_schema:
    description: Схема
    type: string
    from: customfield_10011

  grant_scope:
    description: Объём — все объекты или конкретные
    type: dictionary-item
    dictionary: grant-scopes
    from: customfield_10012

  objects:
    description: Конкретные объекты
    type: string
    multiple: true
    from: customfield_10013

  privileges:
    description: Привилегии
    type: dictionary-item
    dictionary: ora-privileges
    multiple: true
    from: customfield_10014

  public_synonyms:
    description: Публичные синонимы
    type: boolean
    from: customfield_10015

  db_links:
    description: Database links
    type: boolean
    from: customfield_10016

  requester:
    description: Автор заявки
    type: string
    from: issue.reporter

stages:
  # согласующие — параметр стадии + database_approver по целевой БД; кворум всегда «все»
  - code: approval
    name: Согласование в Jira
    handler: jira-approval
    expression: scope == 'any' or public_synonyms
    parameters:
      approvers:
        - i.petrov
        - s.sidorov
    listeners:
      on-start:
        - handler: jira-transition
          parameters:
            status: На согласовании
            fields:
              customfield_10100: ${{ stage.approvers }}
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: task-created
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  - code: prepare
    name: Сборка задачи
    handler: task-preparation
    parameters:
      custom-steps: allowed
      # порядок записей — порядок выполнения на целевой БД
      steps:
        - code: check-user-exists
          name: Учётка существует
          template: ora-check-user-exists@1
          params:
            username: ${{ target_username }}

        - code: check-schema-exists
          name: Схема существует
          template: ora-check-schema-exists@1
          expression: scope == 'schema' or scope == 'owner'
          params:
            schema: ${{ target_schema }}

        - code: grant-schema-all
          name: Права на все объекты схемы
          template: ora-grant-schema-all@1
          expression: scope == 'schema' and grant_scope == 'all'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            privileges: ${{ privileges }}

        - code: grant-objects
          name: Права на конкретные объекты
          template: ora-grant-objects@1
          expression: scope == 'schema' and grant_scope == 'objects'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}
            objects: ${{ objects }}
            privileges: ${{ privileges }}

        - code: grant-schema-owner
          name: Права владельца схемы
          template: ora-grant-schema-owner@1
          expression: scope == 'owner'
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}

        - code: grant-public-synonyms
          name: Публичные синонимы
          template: ora-grant-public-synonyms@1
          expression: scope == 'owner' and public_synonyms
          params:
            username: ${{ target_username }}
            schema: ${{ target_schema }}

        - code: grant-db-links
          name: Database links
          template: ora-grant-db-links@1
          expression: scope == 'owner' and db_links
          params:
            username: ${{ target_username }}

        - code: grant-any
          name: Права на всю БД
          template: ora-grant-any@1
          expression: scope == 'any'
          params:
            username: ${{ target_username }}
            privileges: ${{ privileges }}

  # стейдж подтверждения: активируется по manual-mode флоу (здесь by-database)
  # или по expression; иначе пропускается
  - code: confirm
    name: Подтверждение выполнения на дашборде
    handler: dashboard-approval
    # дополнительное условие: критичные БД подтверждаем всегда
    expression: database_code.critical
    parameters:
      approvers:
        dictionary: db-assignments
        filter: database == database_code
    listeners:
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  - code: execute
    name: Выполнение на БД
    handler: database-execution
    listeners:
      # execute — последняя стадия, финальный статус на её on-success
      on-success:
        - handler: jira-transition
          parameters:
            status: Готово
            comment-template: task-done
      on-error:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-failed
