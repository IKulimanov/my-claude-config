name: PG-3 Отзыв роли у учётной записи PostgreSQL
code: pg-3
source: jira
# id типа запроса «Центра поддержки»; проставить после заведения формы
external-key: "100504"
# отзыв прав может сломать доступ работающему приложению — подтверждаем всегда
manual-mode: manual

variables:
  database_code:
    description: Целевая БД
    type: dictionary-item
    dictionary: databases
    from: customfield_10001
    required: true

  target_username:
    description: Учётная запись
    type: string
    from: customfield_10002
    required: true

  target_role:
    description: Отзываемая роль
    type: string
    from: customfield_10022
    required: true

  requester:
    description: Автор заявки
    type: string
    from: issue.reporter

stages:
  # согласования нет: отзыв прав сужает доступ, решение принимает DBA на confirm
  # стейдж сборки задачи: шаги операции и подготовка скриптов.
  # порядок записей — порядок выполнения на целевой БД
  - code: prepare
    name: Сборка задачи
    handler: task-preparation
    parameters:
      custom-steps: allowed
      steps:
        - code: check-user-exists
          name: Учётка существует
          template: pg-check-user-exists@1
          params:
            username: ${{ target_username }}

        - code: check-role-granted
          name: Роль выдана учётке
          template: pg-check-role-granted@1
          params:
            username: ${{ target_username }}
            role: ${{ target_role }}

        - code: revoke-role
          name: Отозвать роль
          template: pg-revoke-role@1
          params:
            username: ${{ target_username }}
            role: ${{ target_role }}

  # стейдж подтверждения: manual-mode: manual — активируется всегда
  - code: confirm
    name: Подтверждение выполнения на дашборде
    handler: dashboard-approval
    parameters:
      approvers:
        dictionary: db-assignments
        filter: database == database_code
    listeners:
      on-start:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: task-created
      on-reject:
        - handler: jira-transition
          parameters:
            status: Отменена
            comment-template: task-rejected

  # стейдж исполнения; execute — последняя стадия, финальный статус на её on-success
  - code: execute
    name: Выполнение на БД
    handler: database-execution
    listeners:
      on-success:
        - handler: jira-transition
          parameters:
            status: Готово
            comment-template: task-done
      on-error:
        - handler: notify
          parameters:
            to: db-engineers
            channel: telegram
            template: execution-failed
